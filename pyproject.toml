[build-system]
requires = ["setuptools>=68", "wheel", "pip"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-idea-generator"
version = "0.1.0"
description = "Reliable market snapshot, trade idea, and backtest pipeline for the Trade Idea Generator project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.23.0",
  "numpy>=1.26.4",
  "pandas>=2.2.2",
  "pytest>=8.3.5",
  "yfinance>=0.2.54",
]

[project.scripts]
trade-idea-generator = "trade_idea_generator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
